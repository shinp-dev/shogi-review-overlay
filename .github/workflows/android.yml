name: Android CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK 35
        run: |
          SDK_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r23b
      - name: Compile YaneuraOu Material for arm64-v8a
        run: |
          git clone --depth 1 https://github.com/yaneurao/YaneuraOu.git upstream/YaneuraOu
          cd upstream/YaneuraOu
          echo "YaneuraOu source commit: $(git rev-parse HEAD)"
          bash tools/build/android_build.sh -e YANEURAOU_ENGINE_MATERIAL -x 'APP_ABI=arm64-v8a'
          find build/android/MaterialLv1 -type f | head -30
          ENGINE=$(find build/android/MaterialLv1 -type f -name '*arm64-v8a' ! -name '*.log' | head -n 1)
          test -n "$ENGINE"
          file "$ENGINE"
          test -s "$ENGINE"
          mkdir -p ../../app/src/main/jniLibs/arm64-v8a
          cp "$ENGINE" ../../app/src/main/jniLibs/arm64-v8a/libshogi_engine.so
      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: shogi-overlay-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
