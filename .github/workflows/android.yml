name: Android CI
on:
  push:
  pull_request:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK 35 (Linux)
        if: runner.os == 'Linux'
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Android SDK 35 (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: sdkmanager.bat "platforms;android-35" "build-tools;35.0.0"
      - name: Build and test fresh checkout (Linux)
        if: runner.os == 'Linux'
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - name: Build and test fresh checkout (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: gradlew.bat --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - name: Verify native executable in APK
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib
          native = Path("app/src/main/jniLibs/arm64-v8a/libshogi_engine.so")
          with ZipFile("app/build/outputs/apk/debug/app-debug.apk") as apk:
              engine = apk.read("lib/arm64-v8a/libshogi_engine.so")
              assert engine[:6] == bytes([127, 69, 76, 70, 2, 1])
              assert engine[16:20] == bytes([3, 0, 183, 0])
              assert hashlib.sha256(engine).digest() == hashlib.sha256(native.read_bytes()).digest()
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ${{ runner.os == 'Linux' && 'shogi-overlay-debug-apk' || 'shogi-overlay-windows-debug-apk' }}
          path: app/build/outputs/apk/debug/app-debug.apk
