name: Vendor YaneuraOu (maintainer)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vendor-yaneuraou.yml'
      - 'tools/vendor_yaneuraou.py'
permissions:
  contents: write
concurrency:
  group: vendor-yaneuraou-main
  cancel-in-progress: false
jobs:
  vendor:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install build prerequisites
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build pinned native engine once
        run: |
          if [ -f third_party/YaneuraOu.arm64.sha256 ]; then
            echo "Already vendored; no upstream fetch needed."
          else
            ./gradlew --no-daemon :app:prepareYaneuraOu
            python tools/vendor_yaneuraou.py
          fi
      - name: Verify normal APK build and tests
        run: |
          rm -rf .native-build
          ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib
          native = Path("app/src/main/jniLibs/arm64-v8a/libshogi_engine.so").read_bytes()
          expected = Path("third_party/YaneuraOu.arm64.sha256").read_text().strip()
          assert hashlib.sha256(native).hexdigest() == expected
          with ZipFile("app/build/outputs/apk/debug/app-debug.apk") as apk:
              assert apk.read("lib/arm64-v8a/libshogi_engine.so") == native
              assert "assets/shogi_cnn_v1.txt" in apk.namelist()
          assert not Path(".native-build").exists()
          PY
      - name: Commit verified vendor snapshot to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts .gitignore .gitattributes docs/ENGINE.md
          git add -f app/src/main/jniLibs/arm64-v8a/libshogi_engine.so third_party/YaneuraOu third_party/YaneuraOu.REVISION third_party/YaneuraOu.arm64.sha256
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Vendor pinned YaneuraOu ARM64 executable and corresponding source"
          git push origin HEAD:main
